<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFV Perfumes</title>
    <meta name="description" content="DFV Perfumes - Fragancias árabes y de nicho con envíos a todo el país." />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preload" as="image" type="image/webp" href="/hero_campaign_1_m.webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero_campaign_1.webp" media="(min-width: 769px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/hero_campaign_2_m.webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" type="image/webp" href="/hero_campaign_2.webp" media="(min-width: 769px)" />
    <script>
      // Inicia la descarga inmediata de productos, categorías y reels al mismo tiempo que el HTML
      (function () {
        try {
          window.__early = {
            products: fetch('/api/products').catch(function () { return null; }),
            categories: fetch('/api/categories').catch(function () { return null; }),
            reels: fetch('/api/reels').catch(function () { return null; })
          };
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
